services:
  mysql:
    # 指定 MySQL 镜像版本（8.0 稳定版，也可换 5.7）
    image: mysql
    # 容器名称（自定义，方便管理）
    container_name: mysql_latest
    # 重启策略：容器退出时自动重启（除非手动停止）
    restart: always
    # 端口映射：主机端口 3306 → 容器内 3306（避免端口冲突可改主机端口，如 3307:3306）
    ports:
      - "3306:3306"
    # 环境变量（核心配置，按需修改）
    environment:
      # 时区配置（同步宿主机时区）
      TZ: Asia/Shanghai
      # root 密码（必须改！避免默认密码泄露）
      MYSQL_ROOT_PASSWORD: root
      # 默认字符集和排序规则（解决中文乱码）
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # 数据卷挂载：将容器内的 MySQL 数据目录映射到主机，避免容器删除数据丢失
    volumes:
      # 主机目录（自定义） → 容器内数据目录
      - ./data:/var/lib/mysql
      # 可选：挂载自定义配置文件（需先在主机创建 my.cnf）
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf
      # 3. 日志目录挂载（便于日志收集和分析）
      - ./logs:/var/log/mysql
    # 健康检查：确保 MySQL 启动完成后再对外提供服务
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s  # 每 10 秒检查一次
      timeout: 5s    # 检查超时时间 5 秒
      retries: 5     # 重试 5 次失败则判定容器不健康
    # 资源限制（避免占用过多宿主机资源）
    deploy:
      resources:
        limits:
          cpus: '2'       # 限制CPU核心数
          memory: 4G      # 限制内存
    logging:
      driver: "json-file"
      options:
        max-size: "100m"    # 单个日志文件最大100M
        max-file: "3"       # 最多保留3个日志文件
        compress: "true"    # 压缩旧日志
  mysql5.7:
    # 指定 MySQL 镜像版本（8.0 稳定版，也可换 5.7）
    image: mysql:5.7
