# Redis Enterprise Deployment Configuration
# Version: 1.0.0
# Description: Enterprise-grade Redis with persistence, security, and monitoring

services:
  redis:
    # 使用官方 Redis 镜像（alpine 版本，轻量且安全）
    image: redis:7.0-alpine
    
    # 容器名称（便于管理和识别）
    container_name: redis
    
    # 重启策略：容器退出时自动重启（生产环境推荐配置）
    restart: unless-stopped
    
    # 端口映射配置
    ports:
      # Redis 默认端口（应用程序连接端口）
      - "6379:6379"
    
    # 环境变量配置
    environment:
      # 时区配置（与宿主机保持一致）
      TZ: Asia/Shanghai
      # 内存限制配置（根据服务器配置调整）
      REDIS_MAXMEMORY: 1gb
      REDIS_MAXMEMORY_POLICY: allkeys-lru
      
      # 持久化配置
      REDIS_APPENDONLY: "yes"
      REDIS_APPENDFSYNC: "everysec"
      
      # 安全配置
      REDIS_PROTECTED_MODE: "yes"
      REDIS_REQUIREPASS: "${REDIS_PASSWORD}"
      
      # 性能优化
      REDIS_TIMEOUT: "300"
      REDIS_TCP_KEEPALIVE: "300"
    # 数据卷挂载配置
    volumes:
      # 数据持久化（确保数据不丢失）
      - ./data:/data
      
      # 配置文件挂载（支持自定义配置）
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
      
      # 日志文件持久化（便于日志分析和审计）
      - ./logs:/var/log/redis
    # 健康检查配置
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 资源限制配置（根据服务器资源调整）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 安全配置
    security_opt:
      - no-new-privileges:true
    # 日志驱动配置
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"
